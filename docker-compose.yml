services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: mame_dev
      POSTGRES_PASSWORD: mame_dev_password
      POSTGRES_DB: mame_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mame_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
