name = "mame-api"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
CLERK_JWT_ISSUER = "https://vocal-longhorn-17.clerk.accounts.dev"
CLERK_JWT_AUDIENCE = "mame-api"
REQUIRE_MFA_FOR_PRIVILEGED = "false"

# [kv_namespaces]
