name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test defense sanity pack
        run: |
          npx vitest run \
            apps/api/__tests__/admin/admin-routes.test.ts \
            apps/api/__tests__/auth/auth-local-routes.test.ts \
            apps/api/__tests__/auth/authenticate-local-login.test.ts \
            apps/api/__tests__/auth/auth-middleware.test.ts \
            apps/api/__tests__/auth/auth-middleware-jwt.test.ts \
            apps/api/__tests__/auth/auth-verify-flow.test.ts \
            apps/api/__tests__/auth/mfa-enrollment.test.ts \
            apps/api/__tests__/auth/password-hasher.test.ts \
            apps/api/__tests__/auth/password-policy.test.ts \
            apps/api/__tests__/auth/role-middleware.test.ts \
            apps/api/__tests__/auth/secret-cipher.test.ts \
            apps/api/__tests__/auth/totp-service.test.ts \
            apps/api/__tests__/security/security-events.test.ts \
            apps/api/__tests__/security/security-events-route.test.ts \
            apps/api/__tests__/db/enums.test.ts \
            apps/api/__tests__/db/tables.test.ts \
            apps/api/__tests__/db/exports.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Build api
        run: npm run build:api

  # Staging security scan — runs only on develop branch after build
  security-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_API_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_*

  # Staging load test — manual trigger only (cost/time intensive)
  load-test:
    name: k6 Peak Load Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 peak scenario
        run: k6 run --env API_BASE_URL=${{ vars.STAGING_API_URL }} scripts/k6-peak.js

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: k6-results/

  # Staging Lighthouse audit — runs on develop
  lighthouse:
    name: Lighthouse Mobile Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ vars.STAGING_WEB_URL }}
            ${{ vars.STAGING_WEB_URL }}/reports
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
